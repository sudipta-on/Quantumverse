<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Rounded App-Icon Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Orbital Ring 1 (Cyan/Blue Axis) -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.8" transform="rotate(35 32 32)" />

  <!-- Orbital Ring 2 (Purple/Indigo Axis) -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.8" transform="rotate(-35 32 32)" />

  <!-- Horizontal Axis Ring (Subtle Grid Effect) -->
  <ellipse cx="32" cy="32" rx="23" ry="23" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.3" />

  <!-- Central Superposition Node -->
  <circle cx="32" cy="32" r="5" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />

  <!-- Electron Spark Point -->
  <circle cx="49" cy="20" r="2.5" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="49" cy="20" r="1" fill="#ffffff" />
</svg>
